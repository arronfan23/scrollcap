name: Build and verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrollcap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record architecture
        id: platform
        run: echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
      - name: Build app
        run: ./scripts/build.sh
      - name: Verify stitching and video processing
        run: ./scripts/test.sh --no-build
      - name: Package app
        run: ./scripts/package.sh --no-build
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ScrollCap-macos-${{ steps.platform.outputs.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ScrollCap-macos-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [[ -f "$notes" ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "ScrollCap $GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "ScrollCap $GITHUB_REF_NAME" --generate-notes
          fi
